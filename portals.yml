# Portal Scanner Configuration — Abhishek Kumbhar
# HFT / Low-Latency C++ Developer Job Search
# Target: Exchange Connectivity, FIX Protocol, Market Data, Trading Infrastructure

# -- Title filter --
# At least 1 positive must match AND 0 negatives must match (case-insensitive).

title_filter:
  positive:
    # -- C++ core roles --
    - "C++ Engineer"
    - "C++ Developer"
    - "C++ Software Engineer"
    - "C++ Programmer"
    - "Senior C++"
    - "Lead C++"
    - "Staff C++"
    - "Principal C++"
    # -- Low-latency / HFT specific --
    - "Low Latency"
    - "Low-Latency"
    - "High Frequency"
    - "High-Frequency"
    - "HFT"
    - "Algorithmic Trading"
    - "Algo Trading"
    - "Electronic Trading"
    - "Quantitative Developer"
    - "Quant Developer"
    - "Quant C++"
    # -- Exchange & market connectivity --
    - "Exchange Connectivity"
    - "Market Connectivity"
    - "Exchange Gateway"
    - "Trading Gateway"
    - "FIX Protocol"
    - "FIX Engineer"
    - "Market Data"
    - "Feed Handler"
    - "Order Routing"
    - "Order Management"
    - "Execution Management"
    # -- Trading systems broad --
    - "Trading Systems"
    - "Trading Infrastructure"
    - "Trading Platform"
    - "Capital Markets"
    - "Investment Banking Technology"
    - "Markets Technology"
    - "eTrading"
    - "Electronic Markets"
    # -- OMS / EMS --
    - "OMS Developer"
    - "EMS Developer"
    - "Order Management System"
    - "Execution Management System"
    # -- General seniority keywords that pair well --
    - "Latency"
    - "Matching Engine"
    - "Co-location"
    - "FPGA"
    - "Kernel Bypass"
    - "RDMA"
    - "DPDK"
  negative:
    # Exclude non-relevant domains
    - "Junior"
    - "Intern"
    - "Graduate"
    - "Embedded"
    - "Automotive"
    - "Gaming"
    - "Telecom"
    - "Firmware"
    - "ASIC"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "Android"
    - "iOS"
    - "Mobile"
    - "Frontend"
    - "React"
    - "Node.js"
    - "Ruby"
    - "PHP"
    - "Mainframe"
    - "COBOL"
    - "SAP"
    - "Salesforce"
    - "DevOps only"
    - "Data Scientist"
    - "Machine Learning"
    - "AI Engineer"
    - "Cloud Engineer only"
  seniority_boost:
    - "Senior"
    - "Staff"
    - "Principal"
    - "Lead"
    - "Head of"
    - "Director"
    - "Vice President"
    - "VP"

# -- Search queries --
# HFT, low-latency, and trading-specific job board searches.

search_queries:

  # -- LinkedIn-style job boards --
  - name: LinkedIn — C++ Low Latency India
    query: '"C++ Engineer" OR "C++ Developer" "low latency" OR "high frequency" OR "HFT" India site:linkedin.com/jobs'
    enabled: true

  - name: LinkedIn — Exchange Connectivity C++ India
    query: '"exchange connectivity" OR "market connectivity" OR "FIX protocol" "C++" India site:linkedin.com/jobs'
    enabled: true

  - name: LinkedIn — C++ Trading Systems India
    query: '"trading systems" OR "electronic trading" OR "algo trading" "C++" "senior" OR "lead" India site:linkedin.com/jobs'
    enabled: true

  # -- Naukri (India's largest job board) --
  - name: Naukri — C++ Low Latency
    query: 'site:naukri.com "C++" "low latency" OR "high frequency trading" OR "HFT" OR "exchange connectivity"'
    enabled: true

  - name: Naukri — FIX Protocol C++
    query: 'site:naukri.com "FIX protocol" OR "Binary FIX" "C++" "senior" OR "lead" Pune OR Mumbai OR Bangalore'
